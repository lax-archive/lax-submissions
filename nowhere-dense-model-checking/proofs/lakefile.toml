name = "Lax3Proofs"
defaultTargets = ["Lax3Proofs"]

[leanOptions]
autoImplicit = false

# mathlib is part of the archive environment (the pin is archive-wide)
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "c5ea00351c28e24afc9f0f84379aa41082b1188f"

[[require]]
name = "Lax3"
path = "../concepts"

# sparsity: nowhere denseness, UQW, generalized coloring numbers (Lax12)
[[require]]
name = "Lax12"
git = "https://github.com/lax-archive/lax-submissions"
rev = "25a164f8439311426b1033ba7ea21947d829ff88"
subDir = "sparsity-lectures/concepts"

# the word RAM: the machine and timed computation of submission Lax67
[[require]]
name = "Lax67"
git = "https://github.com/lax-archive/lax-submissions"
rev = "9d9639601dea95e60803cfb7db1f6296478dcb42"
subDir = "word-ram/concepts"

# graph encodings (CSR) of submission Lax11
[[require]]
name = "Lax11"
git = "https://github.com/lax-archive/lax-submissions"
rev = "688029c9426eccb2fc339e3a1f2179cb97116edc"
subDir = "ram-linear-time/concepts"

# the IMP+ toolkit (Spec, run_vcg, Lib) of submission Lax67's proofs,
# consumed the same way Lax11Proofs consumes it
[[require]]
name = "Lax67Proofs"
git = "https://github.com/lax-archive/lax-submissions"
rev = "9d9639601dea95e60803cfb7db1f6296478dcb42"
subDir = "word-ram/proofs"

# the sparsity proof modules (Densification pattern and friends)
[[require]]
name = "Lax12Proofs"
git = "https://github.com/lax-archive/lax-submissions"
rev = "25a164f8439311426b1033ba7ea21947d829ff88"
subDir = "sparsity-lectures/proofs"

# the refinement tower (NREST, Autoref, Sepref, IICF, codegen) of
# submission Lax62's proofs, built on Lax67's pipeline and consumed the
# same way
[[require]]
name = "Lax62Proofs"
git = "https://github.com/lax-archive/lax-submissions"
rev = "4001304840876b1a2fe56edd86e9d06fc6f2cfda"
subDir = "refinement-tower/proofs"

[[lean_lib]]
name = "Lax3Proofs"
