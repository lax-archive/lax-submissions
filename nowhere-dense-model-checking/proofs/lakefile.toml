name = "Lax3Proofs"
defaultTargets = ["Lax3Proofs"]

[leanOptions]
autoImplicit = false

# mathlib is part of the archive environment (the pin is archive-wide)
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[require]]
name = "Lax3"
path = "../concepts"

# sparsity: nowhere denseness, UQW, generalized coloring numbers (Lax199508)
[[require]]
name = "Lax199508"
git = "https://github.com/lax-archive/lax-submissions"
rev = "e9845c204d14a5678f9d64c0e6f4ca757d9dc9d0"
subDir = "sparsity-lectures-v4-33/concepts"

# the word RAM: the machine and timed computation of submission Lax808846
[[require]]
name = "Lax808846"
git = "https://github.com/lax-archive/lax-submissions"
rev = "512403f000f23689a1c40d8826062d20f1e28f03"
subDir = "word-ram/concepts"

# graph encodings (CSR) of submission Lax271696
[[require]]
name = "Lax271696"
git = "https://github.com/lax-archive/lax-submissions"
rev = "d82625d050fde928adbe5d23b024a940e6f7d8da"
subDir = "ram-linear-time/concepts"

# the IMP+ toolkit (Spec, run_vcg, Lib) of submission Lax808846's proofs,
# consumed the same way Lax271696Proofs consumes it
[[require]]
name = "Lax808846Proofs"
git = "https://github.com/lax-archive/lax-submissions"
rev = "512403f000f23689a1c40d8826062d20f1e28f03"
subDir = "word-ram/proofs"

# the sparsity proof modules (Densification pattern and friends)
[[require]]
name = "Lax199508Proofs"
git = "https://github.com/lax-archive/lax-submissions"
rev = "e9845c204d14a5678f9d64c0e6f4ca757d9dc9d0"
subDir = "sparsity-lectures-v4-33/proofs"

# the refinement tower (NREST, Autoref, Sepref, IICF, codegen) of
# submission Lax62's proofs, built on Lax808846's pipeline and consumed the
# same way
[[require]]
name = "Lax62Proofs"
git = "https://github.com/lax-archive/lax-submissions"
rev = "d82625d050fde928adbe5d23b024a940e6f7d8da"
subDir = "refinement-tower/proofs"

[[lean_lib]]
name = "Lax3Proofs"
