name = "Lax49Proofs"
defaultTargets = ["Lax49Proofs"]

[leanOptions]
autoImplicit = false

# mathlib is part of the archive environment (the pin is archive-wide)
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "c5ea00351c28e24afc9f0f84379aa41082b1188f"

[[require]]
name = "Lax49"
path = "../concepts"

[[lean_lib]]
name = "Lax49Proofs"

# twin-width tower: the twin-width parameter of submission Lax48
[[require]]
name = "Lax48"
git = "https://github.com/lax-archive/lax-submissions"
rev = "38df64c8b8f8e1bcad0d27d1cf54179f4e6bb89a"
subDir = "twin-width-treewidth-separation/concepts"
