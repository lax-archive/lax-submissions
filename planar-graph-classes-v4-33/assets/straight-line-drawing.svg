<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc"><title id="title">A crossing-free straight-line graph drawing</title><desc id="desc">Five vertices form a pentagonal boundary, with two noncrossing diagonals from the top vertex.</desc><rect width="100%" height="100%" fill="white"/><path d="M380 45L520 100L470 185L290 185L240 100Z" fill="#eff6ff" stroke="#334155" stroke-width="5" stroke-linejoin="round"/><path d="M380 45L470 185M380 45L290 185" fill="none" stroke="#334155" stroke-width="5" stroke-linejoin="round"/><g fill="#2563eb" stroke="white" stroke-width="3"><circle cx="380" cy="45" r="13"/><circle cx="520" cy="100" r="13"/><circle cx="470" cy="185" r="13"/><circle cx="290" cy="185" r="13"/><circle cx="240" cy="100" r="13"/></g><text x="380" y="25" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#334155">Crossing-free straight-line drawing</text></svg>
