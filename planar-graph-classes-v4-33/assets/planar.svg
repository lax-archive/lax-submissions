<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">A planar graph</title>
  <desc id="desc">A crossing-free straight-line drawing of a wheel graph, with six vertices on a hexagonal rim and one central vertex.</desc>
  <rect width="760" height="300" fill="white"/>
  <g fill="#eff6ff" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M380 65 L505 115 L505 215 L380 265 L255 215 L255 115 Z"/>
  </g>
  <g fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round">
    <path d="M380 165 L380 65 M380 165 L505 115 M380 165 L505 215 M380 165 L380 265 M380 165 L255 215 M380 165 L255 115"/>
  </g>
  <g fill="#2563eb" stroke="white" stroke-width="3">
    <circle cx="380" cy="65" r="11"/>
    <circle cx="505" cy="115" r="11"/>
    <circle cx="505" cy="215" r="11"/>
    <circle cx="380" cy="265" r="11"/>
    <circle cx="255" cy="215" r="11"/>
    <circle cx="255" cy="115" r="11"/>
    <circle cx="380" cy="165" r="11"/>
  </g>
  <text x="360" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#334155">A crossing-free straight-line drawing</text>
</svg>
