<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title description">
  <title id="title">Planar triangulation</title>
  <desc id="description">A crossing-free drawing of K4: a triangle with one interior vertex joined to all three corners. Every face, including the outer face, is bounded by a triangle.</desc>
  <rect width="760" height="280" fill="white"/>
  <path d="M380 65L230 245H530Z" fill="#eff6ff" stroke="#334155" stroke-width="5" stroke-linejoin="round"/>
  <path d="M380 65V180L230 245M380 180L530 245" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <g fill="#2563eb" stroke="white" stroke-width="3">
    <circle cx="380" cy="65" r="11"/>
    <circle cx="230" cy="245" r="11"/>
    <circle cx="530" cy="245" r="11"/>
    <circle cx="380" cy="180" r="11"/>
  </g>
  <text x="380" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#334155">Planar triangulation</text>
</svg>
